{{- $root := . -}}
{{- range $service := list "auth" "network" "aws" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service }}-postgres
  labels:
    app.kubernetes.io/name: {{ $service }}-postgres
    {{- include "platform.labels" $root | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ $service }}-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $service }}-postgres
  labels:
    app.kubernetes.io/name: {{ $service }}-postgres
    {{- include "platform.labels" $root | nindent 4 }}
spec:
  serviceName: {{ $service }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $service }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $service }}-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: operations-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ $root.Values.images.postgres }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $service }}
            - name: POSTGRES_USER
              value: {{ $service }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-development-secrets
                  key: {{ $service }}-postgres-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $service | quote }}, "-d", {{ $service | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $service | quote }}, "-d", {{ $service | quote }}]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml $root.Values.resources.postgres | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $root.Values.postgres.storage }}
{{- end }}
